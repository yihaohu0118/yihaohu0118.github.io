  <g text-anchor="middle"><text x="219" y="316" font-size="15" fill="#4a6673" font-weight="700">Perceptual memory</text><text x="219" y="342" font-size="12" fill="#738b95">Preserve visual information</text><text x="502" y="316" font-size="15" fill="#796282" font-weight="700">Thinking memory</text><text x="502" y="342" font-size="12" fill="#9b83a2">Preserve reasoning trajectories</text><text x="360" y="410" font-size="12" fill="#9293a0">Shared experience, without a text-only bottleneck.</text></g></g>
