<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">ViSS conceptual overview</title><desc id="desc">Source-grounded temporal supervision preserves visible state; recent, event, and history views provide evidence for video reasoning.</desc>
