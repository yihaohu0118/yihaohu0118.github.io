  <rect width="720" height="440" fill="#fbfcf9"/><rect width="720" height="440" fill="url(#grid)"/>
  <g font-family="Arial,sans-serif"><text x="35" y="46" font-size="17" font-weight="700" fill="#26362c">Preserve the visible state.</text><text x="35" y="72" font-size="13" fill="#6e776c">Identity · Order · Accumulation · Relations · Sufficiency</text>
  <g transform="translate(40 103)"><g fill="#e4ece2" stroke="#9cab94"><rect width="142" height="85" rx="6"/><rect x="165" width="142" height="85" rx="6"/><rect x="330" width="142" height="85" rx="6"/><rect x="495" width="142" height="85" rx="6"/></g>
