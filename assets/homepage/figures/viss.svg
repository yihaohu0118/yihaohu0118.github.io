  <path d="M360 206v34" stroke="#7f8a7a" stroke-width="2" marker-end="url(#a)"/><rect x="215" y="253" width="290" height="62" rx="8" fill="#dbe7ef" stroke="#8fa4af"/><text x="360" y="278" text-anchor="middle" font-size="14" fill="#30434d" font-weight="700">Visible-State Supervision</text><text x="360" y="300" text-anchor="middle" font-size="12" fill="#596f78">What should the model remember?</text>
